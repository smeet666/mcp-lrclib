# One-shot workflow for the very first publish of this package.
#
# Trusted publishing is configured from a package's settings page on npmjs.com,
# which does not exist until the package has been published once. This workflow
# covers that single bootstrap release using a token, and should be deleted
# afterwards so that no token-based publishing path remains.

name: Bootstrap publish (one-shot)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Still requested, so this first release carries provenance too.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
